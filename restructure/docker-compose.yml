# ═══════════════════════════════════════════════════════════════════════════
# Restructured paper-generation stack — single docker-compose
#
#   ┌───────────────┬───────────────────────┬──────────────────────────────┐
#   │ Service       │ Port / URL            │ Role                         │
#   ├───────────────┼───────────────────────┼──────────────────────────────┤
#   │ orchestrator  │ (internal)            │ MCP agents + graph reasoning │
#   │ viewer        │ localhost:8080        │ live graph/draft/LLM viewer  │
#   └───────────────┴───────────────────────┴──────────────────────────────┘
#
# Figures are drawn as vector SVG by the LLM (see mcp_servers/svg_server.py) —
# no GPU/ComfyUI service is needed. The vLLM LLM engine is NOT in this stack —
# it is a pre-provisioned instance we only connect to (LLM_BASE_URL). searxng,
# crawl4ai, zotero and mineru have been removed entirely.
#
# Quick start:
#   cp .env.example .env            # set LLM_BASE_URL / LLM_API_KEY
#   docker compose up -d --build
#   docker compose logs -f orchestrator
#   open http://localhost:8080/live.html   # watch the graph build in real time
# ═══════════════════════════════════════════════════════════════════════════

services:

  # ── Orchestrator — MCP agents + graph-of-thought ─────────────────────────
  orchestrator:
    build:
      context: .
      dockerfile: Dockerfile
    image: paper-orchestrator:latest
    container_name: paper-orchestrator
    restart: "no"
    # The LLM gateway (LiteLLM/vLLM) listens on the host's loopback
    # (127.0.0.1:4000). Host networking lets the container reach it directly as
    # localhost:4000. The orchestrator publishes no ports, so this is safe.
    # If your gateway instead listens on 0.0.0.0 or a remote host, delete this
    # line and set LLM_BASE_URL to that address (e.g. host.docker.internal).
    network_mode: host
    environment:
      # LLM engine (external vLLM, OpenAI-compatible)
      - LLM_BASE_URL=${LLM_BASE_URL:-https://75e4-160-36-103-252.ngrok-free.app/v1}
      - LLM_MODEL=${LLM_MODEL:-ornl-qwen3-8-27b}
      - LLM_API_KEY=${LLM_API_KEY:-not-needed}
      # Graph-of-thought depth + figure budget
      - GRAPH_DEPTH=${GRAPH_DEPTH:-3}
      - GRAPH_BRANCHING=${GRAPH_BRANCHING:-3}
      # LLM-drawn SVG figures per developed node
      - PAPER_IMAGE_COUNT=${PAPER_IMAGE_COUNT:-2}
      - SVG_MAX_TOKENS=${SVG_MAX_TOKENS:-6000}
      # pipeline | agent | idle
      - PIPELINE_MODE=${PIPELINE_MODE:-pipeline}
      - INPUT_DIR=/inputs
      - OUTPUT_DIR=/outputs
    volumes:
      # Mounted folder with the PDFs + bib/endnote + hypothesis/keywords/style
      - ./inputs:/inputs:ro
      - ./outputs:/outputs

  # ── Live viewer — serves outputs/ so the reasoning graph, drafts and LLM ──
  # calls can be watched in real time at http://localhost:8080/live.html
  viewer:
    image: python:3.11-slim
    container_name: paper-viewer
    restart: unless-stopped
    working_dir: /outputs
    command: python -m http.server 8080
    ports:
      - "8080:8080"
    volumes:
      - ./outputs:/outputs:ro

