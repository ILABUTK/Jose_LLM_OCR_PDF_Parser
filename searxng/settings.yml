# SearXNG settings.yml
# Tuned for academic / PDF discovery used by bib_enrich_download.py
#
# Key changes vs defaults:
#   • json output format enabled   → allows API queries
#   • safesearch = 0               → not needed for academic use, remove false negatives
#   • Engines focused on scholarly content + general web for PDF hunting

default_doi_resolver: "oadoi.org"

general:
  debug: false
  instance_name: "SearXNG (Jose_LLM_OCR)"
  privacypolicy_url: ""
  donation_url: ""
  contact_url: ""
  enable_metrics: false

brand:
  new_issue_url: ""
  docs_url: ""
  public_instances: ""
  wiki_url: ""

search:
  safe_search: 0
  autocomplete: ""
  default_lang: "en"
  ban_time_on_fail: 5
  max_ban_time_on_fail: 120
  suspended_times:
    SearxEngineAccessDenied: 86400
    SearxEngineAPIError: 111
    SearxEngineCaptcha: 86400
    SearxEngineTooManyRequests: 3600
  formats:
    - html
    - json       # ← REQUIRED for API access by bib_enrich_download.py
    - csv
    - rss

server:
  port: 8080
  bind_address: "0.0.0.0"
  secret_key: "948b8ff3c9d4aec7f10be48f510f02b352aca106f9ee93fb3bc1a1523fa319cc"
  base_url: "http://localhost:8080/"
  limiter: false   # disabled — single-user / local instance
  image_proxy: false
  http_protocol_version: "1.0"
  method: "GET"
  public_instance: false

redis:
  url: ""

ui:
  default_locale: ""
  query_in_title: false
  infinite_scroll: false
  default_theme: simple
  center_alignment: false
  results_on_new_tab: true
  static_use_hash: false
  search_on_category_select: true
  hotkeys: default

# ---------------------------------------------------------------------------
# Engines — scholarly + general sources most useful for PDF finding
# ---------------------------------------------------------------------------
engines:
  - name: google scholar
    engine: google_scholar
    shortcut: gsc
    categories: science
    timeout: 10.0

  - name: semantic scholar
    engine: semantic_scholar
    shortcut: s2
    categories: science
    timeout: 10.0

  - name: arxiv
    engine: arxiv
    shortcut: arx
    categories: science
    timeout: 10.0

  - name: pubmed
    engine: pubmed
    shortcut: pm
    categories: science
    timeout: 10.0

  - name: openalex
    engine: json_engine
    shortcut: oax
    categories: science
    url: "https://api.openalex.org/works?search={query}&per-page=5&select=title,doi,best_oa_location"
    url_xpath: "//results//doi"
    title_xpath: "//results//title"
    content_xpath: "//results//best_oa_location//pdf_url"
    timeout: 10.0
    disabled: true   # used directly in script; enable here for UI exploration

  - name: google
    engine: google
    shortcut: g
    categories: general, web
    timeout: 10.0

  - name: duckduckgo
    engine: duckduckgo
    shortcut: ddg
    categories: general, web
    timeout: 10.0

  - name: bing
    engine: bing
    shortcut: bi
    categories: general, web
    timeout: 10.0
    disabled: true

  - name: startpage
    engine: startpage
    shortcut: sp
    categories: general, web
    timeout: 10.0
    disabled: true

categories_as_tabs:
  general:
    weight: 1
  science:
    weight: 2

outgoing:
  request_timeout: 10.0
  max_request_timeout: 30.0
  pool_connections: 100
  pool_maxsize: 20
  enable_http2: true
  networks:
    {}
